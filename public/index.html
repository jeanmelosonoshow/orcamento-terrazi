<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrazi | Gerador de Orçamentos</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        /* Estilos auxiliares para a barra lateral de itens */
        .quote-items {
            margin-bottom: 20px;
        }
        .total-highlight-box {
            background: #1A3017;
            color: white;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #displayTotalGeral {
            display: block;
            font-size: 22px;
            font-weight: bold;
            margin-top: 5px;
        }
        .btn-history {
            background-color: #f4f4f4;
            color: #1A3017;
            border: 1px solid #1A3017;
            padding: 0 15px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            height: 40px;
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-history:hover {
            background-color: #1A3017;
            color: white;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="top-bar-user" style="background: #1A3017; color: #fff; padding: 8px 20px; display: flex; justify-content: space-between; align-items: center; font-family: sans-serif; font-size: 13px;">
        <div id="user-info-topo">
            Carregando identificação...
        </div>
      
    </div>

    <header>
        <div class="logo">
            <img src="https://acdn-us.mitiendanube.com/stores/005/667/009/themes/common/logo-1922118012-1769009009-757fb821fbae032664390fbbb9a301c71769009009-480-0.webp" alt="Terrazi" id="brand-logo">
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Pesquise por SKU ou nome do produto...">
            <div class="header-actions">
                <button id="searchBtn">BUSCAR</button>
                <a href="lista-orcamentos.html" class="btn-history">HISTÓRICO</a>
            </div>
        </div>
    </header>

    <main>
        <section class="results-section">
            <div id="productsGrid" class="products-grid"></div>
        </section>

        <aside class="quote-sidebar">
            <h3>Dados do Orçamento</h3>
            <div class="customer-info" style="display: grid; gap: 8px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee;">
                <input type="text" id="custName" placeholder="Nome do Cliente" required style="font-size: 12px; padding: 8px;">
                <input type="text" id="custDoc" placeholder="CPF / CNPJ" inputmode="numeric" maxlength="18" style="font-size: 12px; padding: 8px;">
                <input type="tel" id="custPhone" placeholder="Telefone do Cliente" required inputmode="numeric" maxlength="16" style="font-size: 12px; padding: 8px;">
                <div style="display:flex; gap:5px; align-items:center;">
                    <label style="font-size: 10px; color: #666;">Validade:</label>
                    <input type="date" id="quoteValid" required style="font-size: 12px; padding: 5px; flex:1;">
                </div>
                <input type="text" id="sellerName" placeholder="Nome do Vendedor" readonly style="font-size: 12px; padding: 8px; background-color: #f9f9f9; cursor: not-allowed;">
                <input type="tel" id="sellerPhone" placeholder="Telefone Vendedor" inputmode="numeric" maxlength="16" style="font-size: 12px; padding: 8px;">
            </div>
        
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="margin: 0;">Itens do Orçamento</h3>
                <button onclick="limparOrcamento()" style="background: none; border: none; color: #999; font-size: 10px; cursor: pointer; text-decoration: underline;">
                    LIMPAR TUDO
                </button>
            </div>
                        
            <div id="quoteItems" class="quote-items"></div>
            
            <div class="quote-footer">
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 10px; color: #666; display: block; margin-bottom: 4px; font-weight: bold; text-transform: uppercase;">Observações Gerais:</label>
                    <textarea id="generalObs" placeholder="Ex: Prazo de entrega 30 dias, Condições de Pagamento..." 
                        style="width: 100%; font-size: 11px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; height: 60px; resize: none;"></textarea>
                </div>
                <button id="generatePdfBtn" class="btn-primary" style="width: 100%; margin-bottom: 10px;">GERAR ORÇAMENTO PDF</button>
                
                <div id="totalHighlight" class="total-highlight-box">
                    <span style="font-size: 10px; text-transform: uppercase; opacity: 0.8;">Valor Total Somado</span>
                    <span id="displayTotalGeral">R$ 0,00</span>
                </div>
            </div>
        </aside>
    </main>

    <div id="pdfActionDialog" class="pdf-action-dialog" hidden>
        <div class="pdf-action-card" role="dialog" aria-modal="true" aria-labelledby="pdfActionTitle">
            <button class="pdf-action-close" type="button" data-pdf-action="cancel" aria-label="Fechar">&times;</button>
            <h2 id="pdfActionTitle">Como deseja continuar?</h2>
            <p>Escolha se deseja baixar o orçamento ou compartilhar o PDF pelo WhatsApp.</p>
            <div class="pdf-action-buttons">
                <button type="button" class="pdf-action-secondary" data-pdf-action="download">Gerar o PDF</button>
                <button type="button" class="pdf-action-primary" data-pdf-action="whatsapp">Enviar PDF no WhatsApp</button>
            </div>
        </div>
    </div>



    <div id="existingBudgetDialog" class="pdf-action-dialog" hidden>
        <div class="pdf-action-card" role="dialog" aria-modal="true" aria-labelledby="existingBudgetTitle">
            <button class="pdf-action-close" type="button" data-existing-action="cancel" aria-label="Fechar">&times;</button>
            <h2 id="existingBudgetTitle">Orçamento já gerado</h2>
            <p>Já existe o orçamento <strong>#<span data-existing-budget-id></span></strong> gerado para esse cliente.</p>
            <div class="pdf-action-buttons">
                <button type="button" class="pdf-action-secondary" data-existing-action="new">Novo orçamento</button>
                <button type="button" class="pdf-action-primary" data-existing-action="update">Imprimir / Atualizar</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
