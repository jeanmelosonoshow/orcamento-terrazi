<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Orçamentos | Terrazi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">   
    <link rel="stylesheet" href="lista-style.css"> 
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div id="top-bar-user" style="background: #1A3017; color: #fff; padding: 8px 20px; display: flex; justify-content: space-between; align-items: center; font-family: sans-serif; font-size: 13px;">
        <div id="user-info-topo">
            Carregando usuário...
        </div>
       
    </div>
    
    <header class="lista-header">
        <div class="header-content">
            <img src="https://acdn-us.mitiendanube.com/stores/005/667/009/themes/common/logo-1922118012-1769009009-757fb821fbae032664390fbbb9a301c71769009009-480-0.webp" alt="Logo Terrazi" class="logo">
            <div class="header-actions-top">
                <h1 class="premium-title">Gestão de Orçamentos</h1>
                <a href="index.html" class="btn-primary-outline">← NOVO ORÇAMENTO</a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="filters-bar">
            <div class="input-wrapper">
                <input type="text" id="searchInput" placeholder="Filtrar por nome ou CPF..." onkeyup="filtrarCards()">
            </div>
            <div class="select-wrapper">
                <select id="statusFilter" onchange="filtrarCards()">
                    <option value="">TODOS OS STATUS</option>
                    <option value="Pendente">PENDENTE</option>
                    <option value="Gerou Venda">GEROU VENDA</option>
                    <option value="Cancelado">CANCELADO</option>
                    <option value="Expirado">EXPIRADO</option>
                </select>
            </div>
        </div>

        <div id="orcamentosGrid" class="orcamentos-grid">
            <div class="loader">Buscando na base de dados...</div>
        </div>
    </main>

    <script src="script-lista.js"></script>
</body>
</html>
