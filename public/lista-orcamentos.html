<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Orçamentos | Terrazi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
   
    <link rel="stylesheet" href="lista-style.css"> 
</head>
<body>
    <header class="lista-header">
        <div class="header-content">
            <img src="https://acdn-us.mitiendanube.com/stores/005/667/009/themes/common/logo-1922118012-1769009009-757fb821fbae032664390fbbb9a301c71769009009-480-0.webp" alt="Logo Terrazi" class="logo">
            <div class="header-actions-top">
                <h1 class="premium-title">Gestão de Orçamentos</h1>
                <a href="index.html" class="btn-primary-outline">← NOVO ORÇAMENTO</a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="filters-bar">
            <div class="input-wrapper">
                <input type="text" id="filterInput" placeholder="Filtrar por nome ou CPF..." onkeyup="filtrarCards()">
            </div>
            <div class="select-wrapper">
                <select id="statusFilter" onchange="filtrarCards()">
                    <option value="">TODOS OS STATUS</option>
                    <option value="Pendente">PENDENTE</option>
                    <option value="Gerou Venda">GEROU VENDA</option>
                    <option value="Cancelado">CANCELADO</option>
                    <option value="Expirado">EXPIRADO</option>
                </select>
            </div>
        </div>

        <div id="orcamentosGrid" class="orcamentos-grid">
            <div class="loader">Buscando na base de dados...</div>
        </div>
    </main>

    <script src="script-lista.js" type="module"></script>
</body>
</html>
