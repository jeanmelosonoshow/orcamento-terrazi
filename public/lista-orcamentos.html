<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Orçamentos | Terrazi</title>
    <link rel="stylesheet" href="style.css"> <link rel="stylesheet" href="lista-style.css"> </head>
<body>
    <header class="lista-header">
        <img src="https://acdn-us.mitiendanube.com/stores/005/667/009/themes/common/logo-1922118012-1769009009-757fb821fbae032664390fbbb9a301c71769009009-480-0.webp" alt="Logo Terrazi" class="logo">
        <div class="header-actions">
            <a href="index.html" class="btn-secondary">← Novo Orçamento</a>
            <h1>Gestão de Orçamentos</h1>
        </div>
    </header>

    <main class="container">
        <div class="filters-bar">
            <input type="text" id="filterInput" placeholder="Filtrar por nome ou CPF..." onkeyup="filtrarCards()">
            <select id="statusFilter" onchange="filtrarCards()">
                <option value="">Todos os Status</option>
                <option value="Pendente">Pendente</option>
                <option value="Finalizado com Venda">Venda</option>
                <option value="Finalizado sem retorno">Sem Retorno</option>
                <option value="Expirado">Expirado</option>
            </select>
        </div>

        <div id="orcamentosGrid" class="orcamentos-grid">
            <div class="loader">Carregando histórico...</div>
        </div>
    </main>

    <script src="script-lista.js" type="module"></script>
</body>
</html>
