<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            if (!sessionStorage.getItem('usuarioLogado')) {
                document.write('<style>body{display:none!important}</style>');
                window.top.location.replace('login.html');
            }
        })();
    </script>
    <title>Histórico de Orçamentos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="lista-style.css?v=20260820a">
    <link rel="stylesheet" href="assets/budget-negotiation.css?v=20260820-1">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <header class="lista-header">
        <div class="header-content">
            <img src="https://acdn-us.mitiendanube.com/stores/005/667/009/themes/common/logo-1922118012-1769009009-757fb821fbae032664390fbbb9a301c71769009009-480-0.webp" alt="Logo da marca" class="logo" data-brand-logo>
            <div class="header-actions-top">
                <h1 class="premium-title">Gestão de Orçamentos</h1>
                <a href="index.html" class="btn-primary-outline" id="novoOrcamentoLink">← NOVO ORÇAMENTO</a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="filters-bar">
            <div class="input-wrapper">
                <input type="text" id="searchInput" placeholder="Filtrar por nome, CPF ou número...">
            </div>
            <div class="select-wrapper status-filter-wrapper">
                <label>Status</label>
                <div class="status-filter" id="statusFilter">
                    <button type="button" class="status-filter-toggle" id="statusFilterToggle" aria-expanded="false">
                        <span id="statusFilterSummary">PENDENTE, EXPIRADO</span>
                        <span class="status-filter-arrow">▾</span>
                    </button>
                    <div class="status-filter-menu" id="statusFilterMenu" hidden>
                        <button type="button" class="status-filter-option is-selected" data-status-option="PENDENTE">
                            <span class="status-check">✓</span><span>PENDENTE</span>
                        </button>
                        <button type="button" class="status-filter-option is-selected" data-status-option="EXPIRADO">
                            <span class="status-check">✓</span><span>EXPIRADO</span>
                        </button>
                        <button type="button" class="status-filter-option" data-status-option="GEROU VENDA">
                            <span class="status-check">✓</span><span>GEROU VENDA</span>
                        </button>
                        <button type="button" class="status-filter-option" data-status-option="CANCELADO">
                            <span class="status-check">✓</span><span>CANCELADO</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="orcamentosGrid" class="orcamentos-grid">
            <div class="loader">Buscando na base de dados...</div>
        </div>
        <div id="paginationControls" class="pagination-controls" aria-label="Paginação de orçamentos"></div>
    </main>

    <script src="theme-loader.js"></script>
    <script src="assets/budget-negotiation.js?v=20260820-1"></script>
    <script src="script-lista.js?v=20260820a"></script>
</body>
</html>
